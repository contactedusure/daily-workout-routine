<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#F9F8F7"/>
<title>Samkit &amp; Mahima — Workout Routine</title>
<style>
:root{
 --bg:#F9F8F7; --card:#FFFFFF; --soft:#F0EFED; --text:#2C2C2B; --sub:#7D7A75; --border:#E6E5E3;
 --accent:#2783DE; --accentSoft:#E5F2FC; --green:#46A171; --greenSoft:#E8F1EC; --orange:#D5803B; --orangeSoft:#FBEBDE; --red:#E56458; --redSoft:#FCE9E7;
}
@media (prefers-color-scheme: dark){
 :root{ --bg:#191919; --card:#202020; --soft:#2A2A29; --text:#FFFFFF; --sub:rgba(255,255,255,.65); --border:rgba(255,255,255,.14);
 --accent:#5E9FE8; --accentSoft:rgba(94,159,232,.12); --green:#72BC8F; --greenSoft:rgba(114,188,143,.12); --orange:#DE9255; --orangeSoft:rgba(222,146,85,.12); --red:#E97366; --redSoft:rgba(233,115,102,.12);}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.5;padding-bottom:92px}
header.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.appTitle{font-weight:700;font-size:17px}
.appSub{color:var(--sub);font-size:13px;margin-top:1px}
.streak{background:var(--orangeSoft);color:var(--orange);font-weight:700;font-size:13px;padding:6px 10px;border-radius:8px;white-space:nowrap}
.progressWrap{position:sticky;top:57px;z-index:9;background:var(--soft);height:4px}
.progressBar{height:4px;background:var(--accent);width:0%;transition:width .2s}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin:0 0 16px}
.card h2{font-size:19px;margin:0 0 4px}
.card h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--sub);font-size:14px}
.timeChip{display:inline-block;background:var(--accentSoft);color:var(--accent);font-weight:600;font-size:12.5px;padding:3px 8px;border-radius:6px;margin-bottom:6px}
.row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--border)}
.row.first{border-top:none}
.chk{appearance:none;-webkit-appearance:none;width:24px;height:24px;min-width:24px;border:2px solid var(--border);border-radius:7px;background:var(--card);position:relative;cursor:pointer;margin-top:2px;padding:0}
.chk:checked{background:var(--green);border-color:var(--green)}
.chk:checked::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.rName{font-weight:600;font-size:15px}
.rName.done{color:var(--sub);text-decoration:line-through;font-weight:500}
.rDose{color:var(--sub);font-size:13px;margin-top:1px}
.infoBtn{margin-left:auto;border:1px solid var(--border);background:var(--soft);color:var(--sub);border-radius:6px;font-size:12px;padding:5px 9px;cursor:pointer;white-space:nowrap;min-height:32px}
.note{background:var(--accentSoft);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:10px}
.noteO{background:var(--orangeSoft);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:10px}
.noteG{background:var(--greenSoft);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:10px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;border:none;color:var(--sub);font-size:11.5px;font-weight:600;padding:7px 2px 9px;cursor:pointer;min-height:54px;font-family:inherit}
.tabs button.active{color:var(--accent)}
.tabs .ico{font-size:20px;display:block;line-height:1.25}
.moveTop{display:flex;gap:12px;align-items:flex-start}
.moveSvg{width:118px;min-width:118px;background:var(--soft);border-radius:10px;padding:8px}
.moveName{font-size:16px;font-weight:700;margin:0}
.tagRow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11.5px;font-weight:600;background:var(--soft);color:var(--sub);border-radius:6px;padding:3px 8px}
.tag.g{background:var(--greenSoft);color:var(--green)}
.tag.b{background:var(--accentSoft);color:var(--accent)}
ol.steps{margin:10px 0 0;padding-left:20px}
ol.steps li{margin:4px 0;font-size:14.5px}
.avoid{margin-top:10px;background:var(--redSoft);border-radius:8px;padding:8px 12px;font-size:13.5px}
.search{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-size:15px;margin-bottom:14px;font-family:inherit}
.pickRow{display:flex;gap:8px;margin:4px 0 10px}
.pick{flex:1;border:1.5px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:12px 10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;min-height:48px}
.pick.sel{border-color:var(--accent);background:var(--accentSoft);color:var(--accent)}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.gCell{background:var(--soft);border-radius:8px;padding:8px 2px;font-size:12px;color:var(--sub)}
.gCell b{display:block;font-size:14px;color:var(--text)}
textarea{width:100%;min-height:90px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);padding:10px;font-size:14.5px;font-family:inherit;resize:vertical}
svg.fig{width:100%;height:auto;display:block}
svg.fig .ground{stroke:var(--border);stroke-width:3;stroke-linecap:round}
svg.fig .b{stroke:var(--text);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.fig .h{fill:var(--text)}
svg.fig .a{stroke:var(--accent);stroke-width:4;fill:none;stroke-linecap:round}
svg.fig .db{fill:var(--accent)}
svg.fig .soft{fill:var(--accentSoft);stroke:none}
svg.fig .thin{stroke:var(--sub);stroke-width:3.5;fill:none;stroke-linecap:round}
h2.sec{font-size:14px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 10px}
ul.tight{margin:6px 0 0;padding-left:20px}
ul.tight li{margin:5px 0;font-size:14.5px}
.big3{display:flex;gap:8px;margin-top:10px}
.big3 div{flex:1;background:var(--soft);border-radius:10px;padding:10px;text-align:center}
.big3 b{display:block;font-size:19px}
.big3 span{font-size:11.5px;color:var(--sub)}
.dayNav{display:flex;gap:6px;margin:0 0 14px}
.dChip{flex:1;min-width:0;border:1.5px solid var(--border);background:var(--card);color:var(--sub);border-radius:10px;padding:7px 2px 6px;cursor:pointer;font-family:inherit;text-align:center;min-height:56px}
.dChip .dName{display:block;font-size:11.5px;font-weight:700}
.dChip .dNum{display:block;font-size:15px;font-weight:700;color:var(--text);margin-top:1px}
.dChip .dDot{display:block;font-size:9.5px;color:var(--accent);font-weight:700;line-height:1.2}
.dChip.sel{border-color:var(--accent);background:var(--accentSoft)}
.dChip.sel .dName,.dChip.sel .dNum{color:var(--accent)}
.rowBtns{margin-left:auto;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.rowBtns .infoBtn{margin-left:0}
.tBtn{background:var(--accentSoft);color:var(--accent);border-color:transparent;font-weight:700}
.tapCard{cursor:pointer;transition:border-color .15s}
.tapCard:active{border-color:var(--accent)}
.tmOverlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px}
.tmCard{background:var(--card);border-radius:16px;padding:24px 20px;width:100%;max-width:360px;text-align:center}
.tmName{font-weight:700;font-size:16px;margin-bottom:4px}
.tmTime{font-size:64px;font-weight:800;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.tmBarWrap{height:8px;background:var(--soft);border-radius:6px;overflow:hidden;margin:12px 0 18px}
.tmBar{height:8px;background:var(--accent);width:0%;transition:width .25s linear}
.tmBtns{display:flex;gap:8px}
.tmBtn{flex:1;border:1.5px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:14px 8px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;min-height:52px}
.tmPrimary{background:var(--accent);border-color:var(--accent);color:#fff}
.bars{display:flex;gap:6px;align-items:flex-end;margin-top:10px}
.barCol{flex:1;min-width:0;text-align:center}
.barTrack{height:90px;background:var(--soft);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
.barFill{width:100%;background:var(--green);border-radius:6px 6px 0 0}
.barPct{font-size:11px;font-weight:700;color:var(--text);margin-top:4px}
.barLbl{font-size:9.5px;color:var(--sub);white-space:nowrap}
.numIn{margin-left:auto;width:88px;padding:10px 8px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:15px;font-family:inherit;text-align:center;min-height:44px}
.miniTbl{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
.miniTbl th,.miniTbl td{padding:7px 4px;border-top:1px solid var(--border);text-align:center;color:var(--text)}
.miniTbl th{color:var(--sub);font-weight:600}
.miniTbl tr th:first-child{text-align:left}
.miniTbl tr:first-child th{border-top:none}
.picker{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.pickBox{width:100%;max-width:340px}
.pickTitle{font-size:22px;font-weight:800;margin-bottom:4px;text-align:center}
.pickSub{color:var(--sub);font-size:13.5px;margin-bottom:22px;text-align:center}
.personBtn{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:18px;margin-bottom:12px;cursor:pointer;font-family:inherit;color:var(--text);text-align:left;min-height:64px}
.personBtn:active{border-color:var(--accent)}
.personBtn .pIco{font-size:30px}
.personBtn .pName{font-size:17px;font-weight:700}
.personBtn .pDesc{font-size:12.5px;color:var(--sub)}
.switchBtn{border:1px solid var(--border);background:var(--soft);color:var(--sub);border-radius:8px;font-size:14px;padding:6px 10px;cursor:pointer;min-height:32px;font-family:inherit;white-space:nowrap}
body.mahima{--accent:#7C5CC9;--accentSoft:#F1EAFD}
@media (prefers-color-scheme: dark){body.mahima{--accent:#BF8EDA;--accentSoft:rgba(191,142,218,.14)}}
</style>
</head>

<header class="top">
  <div>
    <div class="appTitle" id="appTitle">Daily Workout Routine</div>
    <div class="appSub" id="todayLabel">Loading…</div>
  </div>
  <div style="display:flex;gap:8px;align-items:center"><button class="switchBtn" id="switchBtn" title="Switch person">⇄</button><div class="streak" id="streakChip">🔥 0 days</div></div>
</header>
<div class="progressWrap"><div class="progressBar" id="progressBar"></div></div>
<main id="view"></main>
<div class="picker" id="picker" style="display:none">
 <div class="pickBox">
  <div class="pickTitle">Who's working out?</div>
  <div class="pickSub">Plans and progress stay separate on this device.</div>
  <button class="personBtn" data-p="samkit"><span class="pIco">💪</span><span><span class="pName">Samkit</span><br/><span class="pDesc">Strength + stamina plan</span></span></button>
  <button class="personBtn" data-p="mahima"><span class="pIco">🌸</span><span><span class="pName">Mahima</span><br/><span class="pDesc">Gentle strength + walking plan</span></span></button>
 </div>
</div>
<nav class="tabs">
  <button data-tab="today"><span class="ico">✅</span>Today</button>
  <button data-tab="week"><span class="ico">🗓️</span>Week</button>
  <button data-tab="moves"><span class="ico">🏋️</span>Moves</button>
  <button data-tab="food"><span class="ico">🍽️</span>Food</button>
  <button data-tab="track"><span class="ico">📈</span>Track</button>
</nav>

 if(!state.days)state.days={};
 if(!state.tue)state.tue={};
 if(!state.metrics)state.metrics={};
 if(typeof state.notes!=='string')state.notes='';}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function pad(n){return String(n).padStart(2,'0')}

{id:'goblet',name:'Goblet Squat (heels elevated)',dose:'12 reps × 3',tag:'Strength · Legs',svg:'goblet',steps:['Place heels on a small wedge, two books or a folded mat (2–4 cm high).','Hold one 5 kg dumbbell vertically at your chest with both hands.','Feet shoulder-width, toes slightly out. Sit down and back between your heels.','Go as deep as is comfortable without pain, chest up.','Push through your whole foot to stand.'],avoid:'Knees caving inward. Heels lifting off the wedge. This is your main squat while ankle mobility improves — it is not cheating.'},
{id:'chairsquat',name:'Chair Squat (sit-to-stand)',dose:'10–15 reps',tag:'Strength · Legs',svg:'chairsquat',steps:['Stand in front of a sturdy chair, feet shoulder-width.','Reach arms forward for balance.','Sit back and down until you lightly touch the chair — heels stay on the floor.','Push the floor away and stand tall.'],avoid:'Plopping down hard. Control the descent; touch, don\'t collapse.'},
{id:'pushup',name:'Push-Up',dose:'8–12 reps × 3',tag:'Strength · Chest/Arms',svg:'pushup',steps:['Hands under shoulders, body in one straight line from head to heels.','Lower chest toward the floor, elbows about 45° from the body.','Push back up without letting hips sag.','Easier version: hands on a bed or table (incline push-up).'],avoid:'Hips sagging or piking up. Short, half reps.'},
{id:'row',name:'One-Arm Dumbbell Row',dose:'12 each side × 3',tag:'Strength · Back',svg:'row',steps:['Place one hand and same-side knee on a chair or bed edge; back flat.','Other foot on the floor; dumbbell hangs straight down in the free hand.','Pull the elbow up past your hip — like starting a lawnmower.','Squeeze the shoulder blade at the top, lower slowly.'],avoid:'Twisting your torso to lift the weight. Keep the back flat and still.'},
{id:'rdl',name:'Dumbbell Romanian Deadlift (RDL)',dose:'12 reps × 3',tag:'Strength · Hamstrings',svg:'rdl',steps:['Hold dumbbells in front of your thighs, knees soft (slightly bent).','Push your hips back like closing a car door with your butt.','Slide the weights down your thighs to mid-shin, back flat.','Feel the hamstring stretch, then drive hips forward to stand.'],avoid:'Rounding the lower back. Turning it into a squat — the hips go back, not down.'},
{id:'bridge',name:'Glute Bridge',dose:'15 reps × 3',tag:'Strength · Glutes',svg:'bridge',steps:['Lie on your back, knees bent, feet flat and close to your hips.','Push through your heels and lift your hips until shoulders–hips–knees form a line.','Squeeze your glutes for 2 seconds at the top.','Lower slowly. Use the firm pillow under your head if needed.'],avoid:'Arching the lower back at the top instead of squeezing the glutes.'},
{id:'plank',name:'Plank',dose:'30–45 sec × 3',tag:'Core',svg:'plank',steps:['Forearms on the mat, elbows under shoulders.','Body in one straight line — head to heels.','Squeeze glutes and abs, breathe normally.','Stop when form breaks, not when it starts hurting.'],avoid:'Hips sagging or pushing up into a pike.'},
{id:'deadbug',name:'Dead Bug',dose:'10 each side',tag:'Core',svg:'deadbug',steps:['Lie on your back, arms pointing to the ceiling, hips and knees at 90°.','Press your lower back gently into the mat.','Slowly lower the right arm and left leg toward the floor.','Return and switch sides.'],avoid:'Lower back lifting off the mat. Move only as far as you can keep it down.'},
{id:'farmer',name:'Farmer Carry',dose:'30–45 sec × 3',tag:'Strength · Grip/Core',svg:'farmer',steps:['Hold one dumbbell in each hand at your sides.','Stand tall, shoulders back and down, grip hard.','Walk slowly with short, controlled steps.'],avoid:'Leaning to one side or shrugging the shoulders up.'},
{id:'legpress',name:'Leg Press (machine)',dose:'10–12 reps × 2–3',tag:'Gym · Legs',svg:'legpress',steps:['Sit with back and hips flat against the pad, feet shoulder-width at mid-platform.','Unlock the sled and lower until knees are about 90°.','Press the platform away without locking your knees.','Start light; add weight only when all reps feel controlled.'],avoid:'Hips lifting off the pad at the bottom. Bouncing.'},
{id:'chestpress',name:'Chest Press (machine)',dose:'10–12 reps × 2–3',tag:'Gym · Chest',svg:'chestpress',steps:['Adjust the seat so handles are at chest height.','Grip the handles, press forward until arms are almost straight.','Return slowly until you feel a stretch across the chest.'],avoid:'Locking elbows hard at the top. Shoulders shrugging up.'},
{id:'seatedrow',name:'Seated Row (machine)',dose:'10–12 reps × 2–3',tag:'Gym · Back',svg:'seatedrow',steps:['Sit tall, feet on the plate, knees slightly bent.','Pull the handle to your lower ribs, chest up.','Squeeze the shoulder blades together.','Return slowly without rounding your back forward.'],avoid:'Rocking the torso back and forth to move the weight.'},
{id:'latpull',name:'Lat Pulldown (machine)',dose:'10–12 reps × 2–3',tag:'Gym · Back',svg:'latpull',steps:['Adjust the thigh pad so your legs are locked in.','Grip the bar wider than shoulders.','Lean back slightly and pull the bar to your upper chest, elbows driving down.','Control the bar back up.'],avoid:'Pulling the bar behind your neck. Using momentum.'},
{id:'shoulderpress',name:'Shoulder Press',dose:'10 reps × 2–3',tag:'Strength · Shoulders',svg:'shoulderpress',steps:['Sit or stand tall, dumbbells at shoulder height, palms forward.','Press the weights overhead until arms are almost straight.','Lower back to shoulder height with control.'],avoid:'Arching the lower back to push the weight up.'},
{id:'legcurl',name:'Leg Curl (machine)',dose:'10–12 reps × 2–3',tag:'Gym · Hamstrings',svg:'legcurl',steps:['Lie face down with the pad just above your heels.','Curl your heels toward your hips, squeezing the hamstrings.','Lower slowly — the lowering half builds the muscle.'],avoid:'Hips lifting off the pad. Fast, swinging reps.'},
{id:'deepsquat',name:'Supported Deep Squat Hold',dose:'30 sec × 3',tag:'Mobility · Ankles/Hips',svg:'deepsquat',steps:['Hold a doorframe, post or table at chest height.','Feet shoulder-width, heels on the floor.','Sit down into your deepest comfortable squat, using the support for balance.','Hold and breathe. Come up slowly.'],avoid:'Forcing depth or bouncing. Never push into pain — stretch sensation only.'},
{id:'anklerock',name:'Ankle Rocks (knee-to-wall)',dose:'10–15 each side, 1–2× daily',tag:'Mobility · Ankles',svg:'anklerock',steps:['Stand in a lunge facing a wall, front foot flat.','Keep the front heel glued down.','Gently rock the knee forward toward the wall, over the toes.','Rock back and repeat. This is the main fix for your heel-lift.'],avoid:'Heel lifting as the knee goes forward. Pain at the front of the ankle — ease off and stay in a pinch-free range. Monthly test: big toe 10 cm from wall, heel down, knee touches wall.'},
{id:'calfstretch',name:'Calf Stretch (wall)',dose:'45 sec each side',tag:'Mobility · Calves',svg:'calfstretch',steps:['Hands on a wall, one leg straight behind you, heel pressed down, toes forward.','Lean in until you feel a stretch in the upper calf — hold 45 sec.','Then bend the back knee slightly to stretch the deeper soleus — another 45 sec.','Switch sides.'],avoid:'Back heel lifting. Bouncing.'},
{id:'hamstring',name:'Hamstring Stretch / Floss',dose:'1 min each side',tag:'Mobility · Hamstrings',svg:'hamstring',steps:['Sit with one leg straight, the other bent away.','Hinge forward from the hips with a flat back until a mild stretch behind the thigh.','Floss version: within the stretch, gently straighten and bend the knee 10 times.'],avoid:'Rounding the spine hard to reach further. Range comes from the hips.'},
{id:'lunge',name:'Low Lunge (hip flexor)',dose:'1 min each side',tag:'Mobility · Hips',svg:'lunge',steps:['Kneel into a low lunge, back knee on the mat (pillow under it if needed).','Tuck the pelvis slightly, then shift your weight forward.','Feel the stretch at the front of the back hip. Keep the torso tall.'],avoid:'Overarching the lower back instead of tucking the pelvis.'},
{id:'figure4',name:'Figure-Four Stretch',dose:'1 min each side',tag:'Mobility · Glutes',svg:'figure4',steps:['Lie on your back, cross the right ankle over the left knee.','Pull the left thigh toward your chest with both hands.','Feel the stretch in the right hip/glute. Switch sides.'],avoid:'Pulling hard on the knee joint itself — hold the thigh.'},
{id:'downdog',name:'Downward Dog',dose:'1 min',tag:'Yoga',svg:'downdog',steps:['From hands and knees, lift your hips up and back into an inverted V.','Hands shoulder-width, fingers spread.','Pedal the heels gently; a soft knee bend is fine.'],avoid:'Dumping weight into the shoulders — push the floor away.'},
{id:'cobra',name:'Cobra',dose:'30–60 sec',tag:'Yoga',svg:'cobra',steps:['Lie face down, hands under shoulders.','Press the chest up; hips stay on the mat.','Shoulders away from ears, elbows soft.'],avoid:'Straightening the arms fully if the back pinches — stay lower.'},
{id:'catcow',name:'Cat-Cow',dose:'10 slow reps',tag:'Yoga · Spine',svg:'catcow',steps:['Hands under shoulders, knees under hips.','Inhale: drop the belly, lift chest and tailbone (cow).','Exhale: round the spine up, tuck chin (cat).','Move one breath per position.'],avoid:'Rushing. This is a warm-up, not a stretch contest.'},
{id:'child',name:'Child\'s Pose',dose:'1–2 min',tag:'Yoga · Recovery',svg:'child',steps:['Knees wide, big toes touching, sit hips toward heels.','Reach arms forward, forehead to the mat.','Breathe slowly into the lower back.'],avoid:'Forcing hips to heels if knees complain — widen the knees or use the pillow.'},
{id:'fold',name:'Forward Fold (bent knees)',dose:'1 min',tag:'Mobility · Hamstrings',svg:'fold',steps:['Stand or sit with knees generously bent.','Hinge from the hips and let the head and arms hang heavy.','Breathe slowly; let gravity do the work.'],avoid:'Locking the knees and pulling hard — bent knees protect the back.'},
{id:'twist',name:'Supine Twist',dose:'1 min each side',tag:'Yoga · Spine',svg:'twist',steps:['Lie on your back, arms out in a T.','Drop both knees to one side.','Look to the opposite side and breathe. Switch sides.'],avoid:'Forcing the knees to the floor — support them with the pillow if they hover.'},
{id:'surya',name:'Surya Namaskar',dose:'5 rounds',tag:'Yoga · Flow',svg:'downdog',steps:['Prayer → arms up and back.','Fold forward → one leg back to lunge.','Plank → knees-chest-chin down → cobra.','Downward dog → same leg forward → fold.','Rise, arms up → prayer. One breath per movement.'],avoid:'Holding your breath. Move smoothly; 5 comfortable rounds beat 10 rushed ones.'}
];

{id:'mclamshell',name:'Clamshell',dose:'10 each side',tag:'Strength \u00B7 Hips',svg:'clamshell',steps:['Lie on your side, knees bent about 90\u00B0, feet together.','Keeping the feet touching, slowly open the top knee like a clamshell.','Pause 1 second at the top, lower slowly.','Do both sides.'],avoid:'Rolling the hips backward. Fast, swingy reps.'},
{id:'mbirdog',name:'Bird-Dog',dose:'6 each side, slow',tag:'Core \u00B7 Deep (safe)',svg:'birdog',steps:['On all fours, hands under shoulders, knees under hips.','Gently brace the lower belly \u2014 about 20% effort.','Extend the opposite arm and leg slowly, hold 3 seconds.','Return and switch. Hips stay perfectly level.'],avoid:'Lifting so high the lower back sags. Holding your breath.'},
{id:'mdeadbug',name:'Modified Dead Bug (heel tap)',dose:'8 each side',tag:'Core \u00B7 Deep (safe)',svg:'deadbug',steps:['Lie on your back, knees bent, feet flat on the floor.','Gently brace the lower belly \u2014 like slowly zipping snug jeans.','Slowly lower ONE heel to tap the floor.','Return and switch. The back stays gently heavy on the mat.'],avoid:'Both legs together \u2014 not yet. Any pulling at the scar: make the movement smaller.'},
{id:'mleglift',name:'Side-Lying Leg Lift',dose:'10 each side',tag:'Strength \u00B7 Hips',svg:'leglift',steps:['Lie on your side, bottom leg bent for support.','Top leg straight, foot flexed.','Lift slowly to about hip height.','Lower slower than you lifted. Do both sides.'],avoid:'Swinging the leg. Toes pointing up \u2014 keep the foot flexed.'},
{id:'mcalfraise',name:'Standing Calf Raise',dose:'12 reps',tag:'Strength \u00B7 Calves/Balance',svg:'calfraise',steps:['Stand tall, fingertips on a wall or chair back.','Rise up on your toes slowly.','Pause 1 second at the top.','Lower slowly.'],avoid:'Bouncing at the bottom. Gripping the wall hard.'},
{id:'mbalance',name:'Single-Leg Stand',dose:'20\u201330 sec each side',tag:'Balance',svg:'balance',steps:['Stand tall near a wall, fingertips resting on it.','Lift one foot a few centimetres off the floor.','Hold 20\u201330 seconds, breathing normally.','Switch sides.'],avoid:'Holding your breath. Clawing the wall \u2014 fingertips only.'},
{id:'mbreathing',name:'Diaphragmatic Breathing + Gentle Brace',dose:'3 min',tag:'Core \u00B7 Deep (safe)',svg:'breathing',steps:['Lie on your back, knees bent, hands on your lower ribs.','Inhale into the sides of the ribs \u2014 you should feel your hands move out.','Exhale slowly while gently drawing the lower belly inward, about 20% effort \u2014 like zipping snug jeans, not sucking in hard.','Continue for 3 minutes, slow and easy. This trains the body\'s corset muscle without pressuring the scar.'],avoid:'Hard sucking-in. Any breath holding. This should feel calming, never strained.'},
{id:'mmassage',name:'Scar Self-Massage',dose:'3\u20134 min',tag:'Scar care',svg:'massage',steps:['Best after a warm shower or with a little oil.','Gentle fingertip circles AROUND the ball \u2014 not on the most tender point.','Light skin glides up/down and side-to-side over the scar.','Gently lift and roll the skin around it. 3\u20134 minutes total. Mild pulling is okay; sharp pain is not.'],avoid:'Sharp pain. Pressing hard directly on the tenderest spot. If her doctor restricts scar massage, follow that instead.'},
{id:'mcatcow',name:'Cat-Cow (small range)',dose:'8 slow reps',tag:'Yoga \u00B7 Spine',svg:'catcow',steps:['Hands under shoulders, knees under hips.','Inhale: gently drop the belly a little, lift the chest (cow).','Exhale: round the spine softly, tuck the chin slightly (cat).','Small, comfortable range \u2014 one breath per position.'],avoid:'Deep ranges that stretch the scar. Rushing.'},
{id:'mtwist',name:'Supine Twist',dose:'45 sec each side',tag:'Yoga \u00B7 Spine',svg:'twist',steps:['Lie on your back, arms out in a T.','Drop both knees gently to one side.','Look to the opposite side and breathe. Switch sides.'],avoid:'Forcing the knees to the floor \u2014 support them with a pillow if they hover.'},
{id:'mchild',name:'Child\'s Pose (side breathing)',dose:'1 min',tag:'Yoga \u00B7 Recovery',svg:'child',steps:['Knees wide, big toes touching, sit the hips toward the heels.','Reach the arms forward, forehead to the mat.','Breathe slowly into the LEFT side of the ribs \u2014 this gently stretches the scarred side.'],avoid:'Forcing the hips to the heels if the knees complain \u2014 widen the knees or use a pillow.'}

 if(secs)btns+='<button class="infoBtn tBtn" data-t="'+secs+'" data-n="'+esc(it.name)+'">\u25B6 '+fmtDur(secs)+'</button>';
 if(it.ref)btns+='<button class="infoBtn" data-ref="'+it.ref+'">How?</button>';
 return '<div class="row'+(first?' first':'')+'"><input type="checkbox" class="chk" data-k="'+it.k+'"'+chk+'/><div><div class="rName'+done+'">'+esc(it.name)+'</div><div class="rDose">'+it.dose+'</div></div><div class="rowBtns">'+btns+'</div></div>'}

function dayNavHtml(){var h='<div class="dayNav">';var today=new Date().getDay();
 WEEKDAYS.forEach(function(d){var p=PLAN[d];var dt=dateForDow(d);
  h+='<button class="dChip'+(d===viewDow?' sel':'')+'" data-day="'+d+'"><span class="dName">'+p.name.slice(0,3)+'</span><span class="dNum">'+dt.getDate()+'</span>'+(d===today?'<span class="dDot">today</span>':'<span class="dDot">&nbsp;</span>')+'</button>';});
 return h+'</div>';}

function renderToday(){var p=PLAN[viewDow];var isToday=viewDow===new Date().getDay();
 var dt=dateForDow(viewDow);var key=dk(dt);var ds=dayState(key);var h='';
 h+=dayNavHtml();
 h+='<div class="card"><h2>'+p.name+(isToday?'':' (preview)')+'</h2><div class="muted">'+p.title+'</div>';
 if(p.note)h+='<div class="noteO" style="margin-top:10px">'+p.note+'</div>';
 if(!isToday)h+='<div class="note" style="margin-top:10px">You are viewing '+p.name+'\u2019s plan for '+p.name.slice(0,3)+' '+dt.getDate()+' '+MNAMES[dt.getMonth()]+'. Ticks are saved against that date \u2014 handy if you swap days. Tap "today" above to jump back.</div>';
 h+='</div>';
 if(p.conditional){var v=state.tue[key]||'';
  h+='<div class="card"><h3>Yoga class today?</h3><div class="pickRow"><button class="pick'+(v==='class'?' sel':'')+'" data-pick="class">\u2705 Class happened</button><button class="pick'+(v==='home'?' sel':'')+'" data-pick="home">\uD83C\uDFE0 Class cancelled</button></div>';
  if(v==='class'){h+='<div class="noteG">Attend class. Don\'t add a second hard workout \u2014 the class is today\'s training.</div>';
   h+=rowHtml({k:'tue-class',name:'Yoga class attended',dose:'60 min'},ds,true);
   h+=rowHtml({k:'tue-pran',name:'Pranayam (if not covered in class)',dose:'10\u201315 min'},ds,false);
  }else if(v==='home'){p.homeBlocks.forEach(function(b,bi){h+=blockHtml(b,ds,bi)});
  }else{h+='<div class="muted">Pick one to load the checklist.'+(isToday?'':' (Preview below assumes class is cancelled.)')+'</div>';
   if(!isToday)p.homeBlocks.forEach(function(b,bi){h+=blockHtml(b,ds,bi)});}
  h+='</div>';
 }else{p.blocks.forEach(function(b,bi){h+=blockHtml(b,ds,bi)});}
 if(CUR.footerCard)h+=CUR.footerCard;
 document.getElementById('view').innerHTML=h;recount();window.scrollTo(0,0);}

function blockHtml(b,ds,bi){var h='<div class="card"><span class="timeChip">'+b.time+'</span><h3>'+b.name+'</h3>';
 b.items.forEach(function(it,ii){h+=rowHtml({k:'b'+bi+'-'+ii,name:it.name,dose:it.dose,ref:it.ref},ds,ii===0)});
 if(b.note)h+='<div class="note">'+b.note+'</div>';
 h+='</div>';return h;}

function renderWeek(){var h='<h2 class="sec">Fixed weekly schedule \u2014 tap any day to open it</h2>';
 WEEKDAYS.forEach(function(d){var p=PLAN[d];h+='<div class="card tapCard" data-daylink="'+d+'"><h3>'+p.name+'</h3><div class="muted">'+p.title+'</div></div>';});
  CUR.weekExtra.forEach(function(w){h+=w});
 document.getElementById('view').innerHTML=h;}

function renderMoves(q){q=(q||'').toLowerCase();var h='<input class="search" id="mSearch" placeholder="Search an exercise\u2026" value="'+esc(q)+'"/>';
 var found=0;
 MOVES.forEach(function(m){if(q&&m.name.toLowerCase().indexOf(q)<0&&m.tag.toLowerCase().indexOf(q)<0)return;found++;
  h+='<div class="card" id="mv-'+m.id+'"><div class="moveTop"><div class="moveSvg">'+fig(m.svg)+'</div><div><div class="moveName">'+m.name+'</div><div class="tagRow"><span class="tag b">'+m.dose+'</span><span class="tag g">'+m.tag+'</span></div></div></div><ol class="steps">';
  m.steps.forEach(function(s){h+='<li>'+s+'</li>'});
  var secs=doseSeconds(m.dose);
  h+='</ol><div class="avoid"><b>Avoid:</b> '+m.avoid+'</div>';
  if(secs)h+='<button class="tmOpen tBtn infoBtn" style="margin:10px 0 0" data-t="'+secs+'" data-n="'+esc(m.name)+'">\u25B6 Start '+fmtDur(secs)+' timer</button>';
  h+='</div>';});
 if(!found)h+='<div class="card muted">No exercise matches "'+esc(q)+'".</div>';
 document.getElementById('view').innerHTML=h;}

function renderFood(){var h='<h2 class="sec">'+CUR.foodSec+'</h2>';
 FOOD.forEach(function(f){h+='<div class="card"><h3>'+f.t+'</h3><div class="'+f.cls+'"><ul class="tight">';
  f.lines.forEach(function(l){h+='<li>'+l+'</li>'});h+='</ul></div></div>';});
 document.getElementById('view').innerHTML=h;}

function renderTrack(){var wk=mondayKey();var ms=state.metrics[wk]||{};var h='';
 var done=0;var items=itemsForToday();items.forEach(function(it){if(dayState(dk())[it.k])done++});
 var grid='';var names=['M','T','W','T','F','S','S'];
 for(var i=0;i<7;i++){var d=new Date();var dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow+i);var x=state.days[dk(d)];
  var mark=x&&x.__done?'\u2705':(x&&Object.keys(x).some(function(k){return k!=='__done'&&x[k]})?'\u25D0':'\u00B7');
  grid+='<div class="gCell"><b>'+mark+'</b>'+names[i]+'</div>';}
 h+='<div class="card"><h3>This week</h3><div class="grid7">'+grid+'</div><div class="big3"><div><b>'+done+'/'+items.length+'</b><span>today ticked</span></div><div><b id="streakNum">\u2013</b><span>day streak</span></div><div><b id="bestNum">\u2013</b><span>best streak</span></div></div></div>';

 h+='<div class="card"><h3>Weekly completion \u2014 last 8 weeks</h3><div class="bars">';
 for(var w=7;w>=0;w--){var ws=new Date();var dow0=(ws.getDay()+6)%7;ws.setDate(ws.getDate()-dow0-w*7);
  var tot=0,dn2=0;
  for(var wd=0;wd<7;wd++){var dd=new Date(ws);dd.setDate(dd.getDate()+wd);var kk=dk(dd);var its=itemsForDay(dd.getDay(),kk);var dss=state.days[kk]||{};
   tot+=its.length;its.forEach(function(it){if(dss[it.k])dn2++});}
  var pct=tot?Math.round(dn2/tot*100):0;
  var lbl=ws.getDate()+' '+MNAMES[ws.getMonth()];
  h+='<div class="barCol"><div class="barTrack"><div class="barFill" style="height:'+Math.max(pct,2)+'%"></div></div><div class="barPct">'+pct+'%</div><div class="barLbl">'+lbl+'</div></div>';}
 h+='</div>';
 var totalDone=0;Object.keys(state.days).forEach(function(k){if(state.days[k]&&state.days[k].__done)totalDone++});
 h+='<div class="muted" style="margin-top:10px">'+totalDone+' fully completed day'+(totalDone===1?'':'s')+' recorded. Each bar = share of that week\'s checklist items ticked (Mon\u2013Sun).</div></div>';

 var vals=ms.vals||{};
 h+='<div class="card"><h3>Sunday numbers</h3><div class="muted" style="margin-bottom:4px">Enter once every Sunday \u2014 the trend table builds itself over the weeks.</div>';
 var NUMS=CUR.nums;
 NUMS.forEach(function(n,i){var v=vals[n[0]]!=null?vals[n[0]]:'';
  h+='<div class="row'+(i===0?' first':'')+'"><div class="rName" style="font-weight:500">'+n[1]+'</div><input class="numIn" data-num="'+n[0]+'" inputmode="decimal" placeholder="\u2014" value="'+v+'"/></div>';});
 var weeks=[];
 for(var w2=4;w2>=1;w2--){var ws2=new Date();var dq=(ws2.getDay()+6)%7;ws2.setDate(ws2.getDate()-dq-w2*7);weeks.push(dk(ws2));}
 var rows='';
 NUMS.forEach(function(n){var cells='';var any=false;
  weeks.concat([wk]).forEach(function(k2){var mm=state.metrics[k2];var vv=(mm&&mm.vals&&mm.vals[n[0]]!=null)?mm.vals[n[0]]:'\u2013';if(vv!=='\u2013')any=true;cells+='<td>'+vv+'</td>';});
  if(any)rows+='<tr><th>'+n[1].split(' (')[0]+'</th>'+cells+'</tr>';});
 if(rows)h+='<table class="miniTbl"><tr><th></th>'+weeks.map(function(k2){return '<th>'+k2.slice(5)+'</th>'}).join('')+'<th>This wk</th></tr>'+rows+'</table>';
 h+='<div class="note" style="margin-top:12px">'+CUR.trackNote+'</div></div>';

 var METRICS=CUR.metrics;
 h+='<div class="card"><h3>Sunday checklist</h3>';
 METRICS.forEach(function(m,i){var on=ms[i]?' checked':'';h+='<div class="row'+(i===0?' first':'')+'"><input type="checkbox" class="chk metric" data-m="'+i+'"'+on+'/><div class="rName" style="font-weight:500">'+m+'</div></div>';});
 h+='</div>';
 h+='<div class="card"><h3>Notes for this week</h3><textarea id="notes" placeholder="Energy, soreness, what felt easy/hard, travel days\u2026">'+esc(state.notes)+'</textarea></div>';
 h+='<div class="card"><h3>Staying regular</h3><ul class="tight">';
 TIPS.forEach(function(t){h+='<li>'+t+'</li>'});h+='</ul></div>';
 document.getElementById('view').innerHTML=h;
 document.getElementById('streakNum').textContent=streak();
 document.getElementById('bestNum').textContent=bestStreak();}

var TABS={today:renderToday,week:renderWeek,moves:function(){renderMoves('')},food:renderFood,track:renderTrack};
function go(tab){if(!TABS[tab])tab='today';
 document.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('active',b.dataset.tab===tab)});
 TABS[tab]();}

var view=document.getElementById('view');
view.addEventListener('change',function(e){var t=e.target;
 if(t.classList.contains('chk')&&t.dataset.k!=null){var ds=dayState(dk(dateForDow(viewDow)));ds[t.dataset.k]=t.checked;save();
  var row=t.closest('.row');if(row){var n=row.querySelector('.rName');if(n)n.classList.toggle('done',t.checked);}
  recount();}
 if(t.classList.contains('metric')){var wk=mondayKey();if(!state.metrics[wk])state.metrics[wk]={};state.metrics[wk][t.dataset.m]=t.checked;save();}
 if(t.id==='notes'){state.notes=t.value;save();}
});
view.addEventListener('click',function(e){var t=e.target;
 var chip=t.closest?t.closest('.dChip'):null;
 if(chip){viewDow=parseInt(chip.dataset.day,10);renderToday();return;}
 var daylink=t.closest?t.closest('[data-daylink]'):null;
 if(daylink){viewDow=parseInt(daylink.dataset.daylink,10);location.hash='#/today';renderToday();return;}
 var tbtn=t.closest?t.closest('.tBtn'):null;
 if(tbtn){openTimer(tbtn.dataset.n,parseInt(tbtn.dataset.t,10));return;}
 if(t.classList.contains('infoBtn')){var ref=t.dataset.ref;if(location.hash==='#/moves'){go('moves');}else{location.hash='#/moves';}setTimeout(function(){var el=document.getElementById('mv-'+ref);if(el){el.scrollIntoView({block:'start'});window.scrollBy(0,-70);}},90);return;}
 if(t.classList.contains('pick')){state.tue[dk(dateForDow(viewDow))]=t.dataset.pick;save();renderToday();return;}
});
view.addEventListener('input',function(e){var t=e.target;
 if(t.id==='mSearch'){renderMoves(t.value);var el=document.getElementById('mSearch');el.focus();el.setSelectionRange(el.value.length,el.value.length);}
 if(t.classList.contains('numIn')){var wk=mondayKey();if(!state.metrics[wk])state.metrics[wk]={};if(!state.metrics[wk].vals)state.metrics[wk].vals={};
  var v=parseFloat(t.value);if(isNaN(v))delete state.metrics[wk].vals[t.dataset.num];else state.metrics[wk].vals[t.dataset.num]=v;save();}
});
document.querySelectorAll('.tabs button').forEach(function(b){b.addEventListener('click',function(){location.hash='#/'+b.dataset.tab})});
window.addEventListener('hashchange',function(){go((location.hash||'#/today').replace('#/',''));
 var st=sessionStorage.getItem('scrollTo');if(st){sessionStorage.removeItem('scrollTo');setTimeout(function(){var el=document.getElementById('mv-'+st);if(el)el.scrollIntoView({block:'start'})},50);}});

var CUR=null;
function setProfile(id,tab){if(!PROFILES[id])id='samkit';CUR=PROFILES[id];KEY=CUR.KEY;PLAN=CUR.PLAN;MOVES=CUR.MOVES;FOOD=CUR.FOOD;TIPS=CUR.TIPS;
 try{localStorage.setItem('fit.profile',id)}catch(e){}
 loadState();
 document.getElementById('appTitle').textContent=CUR.icon+' '+CUR.name;
 document.body.classList.toggle('mahima',id==='mahima');
 var dnow=new Date();var dn=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][dnow.getDay()];
 document.getElementById('todayLabel').textContent=dn.slice(0,3)+' '+dnow.getDate()+' '+MNAMES[dnow.getMonth()]+' · '+PLAN[dnow.getDay()].title;
 viewDow=dnow.getDay();
 document.getElementById('picker').style.display='none';
 go(tab||'today');streak();}
document.getElementById('switchBtn').addEventListener('click',function(){document.getElementById('picker').style.display='flex';});
document.querySelectorAll('.personBtn').forEach(function(b){b.addEventListener('click',function(){setProfile(b.dataset.p,'today');location.hash='#/today';});});
var savedP=null;try{savedP=localStorage.getItem('fit.profile')}catch(e){}
if(savedP&&PROFILES[savedP]){setProfile(savedP,(location.hash||'#/today').replace('#/',''));
 var st0=sessionStorage.getItem('scrollTo');if(st0){sessionStorage.removeItem('scrollTo');setTimeout(function(){var el=document.getElementById('mv-'+st0);if(el)el.scrollIntoView({block:'start'})},50);}
}else{document.getElementById('picker').style.display='flex';}
</script>
